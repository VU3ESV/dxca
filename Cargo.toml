[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vu2cpl/dxca"
# Floor imposed by the committed Cargo.lock, not by our own code:
# ureq -> url -> idna -> idna_adapter -> icu_* 2.3.0 all require 1.88.
# (edition 2024 only needs 1.85, so the lockfile is what binds.) Declaring
# it here makes cargo refuse in seconds with a clear message instead of
# after resolving 148 crates, and — with resolver 3 — keeps `cargo update`
# from picking dependency versions that would raise the floor silently.
# Keep in step with MIN_RUSTC in install.sh.
rust-version = "1.88"

[workspace.dependencies]
# Internal crates — always depend on these via workspace so paths stay in one place.
dxca-core = { path = "crates/dxca-core" }
dxca-connect = { path = "crates/dxca-connect" }

# External dependencies, pinned once for the whole workspace (Meridian
# discipline: few deps, added only when a milestone actually needs them).
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
# Embeds web-ui/dist into the server binary so the deliverable stays
# "one binary + one TOML" (plan §9). dxca-server's build.rs guarantees the
# dir exists, so plain `cargo build` never requires Node.
include_dir = "0.7"
# M4: per-user state. `bundled` vendors the SQLite amalgamation (compiled
# by cc, Meridian pattern) — no system libsqlite3 on any target.
rusqlite = { version = "0.32", features = ["bundled"] }
# Password hashing (PHC-string API) + session-token entropy + token hashing.
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
# Blocking HTTPS client for ClubLog/Telegram (rustls — meridian's http1.rs
# is plain-HTTP only, and these endpoints are TLS).
ureq = { version = "2", features = ["json"] }
# ClubLog responses are gzipped.
flate2 = "1"
# MQTT publish for the panadapter feed. default-features off: that drops
# TLS, websocket and proxy support, none of which the shack broker uses
# (plain 1883 with username/password). Turning `use-rustls` back on is the
# change to make if a broker ever needs 8883.
rumqttc = { version = "0.25", default-features = false }
